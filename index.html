<html lang="zh-CN">
<head>

  <title>Xueting's HEP HOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

<body>
  <header class="header" id="header">
    <h1 class="site-title">Xueting's HEP HOME</h1>
    <p class="site-subtitle">High Energy Physics · Learning &amp; Research</p>
    <p class="tagline">记录物理与前端学习的每一步成长，在 arXiv 的论文海洋中探索未知</p>
    <div class="scroll-hint">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </div>
  </header>

  <section class="about">
    <h2>About</h2>
    <p>物理学子，热爱高能物理与计算科学。这是一个记录学习历程、展示研究笔记的个人站点，也是我持续探索 arXiv 前沿论文的知识花园。</p>
  </section>

  <!-- HEP-EX Daily Pick -->
  <section class="section">
    <h2 class="section-title">HEP-EX Daily Pick</h2>
    <div id="hep-ex-card" class="hep-ex-loading">
      <div class="loading-spinner"></div>
      <p>正在从 arXiv 获取最新论文...</p>
    </div>
  </section>

  <!-- Projects -->
  <section class="section">
    <h2 class="section-title">Projects &amp; Assignments</h2>
    <div class="grid">
      <!-- Populated by app.js from data/projects.json -->
    </div>
  </section>
